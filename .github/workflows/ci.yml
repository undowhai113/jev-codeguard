name: CI & Security Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test-matrix:
    name: Build & Test (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & run unit, concurrency, and security test suites
        run: npm test

  security-and-package-gate:
    name: Dependency Audit, Tarball & Secret Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Verify clean npm package tarball
        run: |
          npm run build
          npm pack --dry-run

      - name: Scan for accidental API keys, shell:true options, or private LAN IPs
        run: |
          if grep -RInE 'jev_live_[A-Za-z0-9]{12,}|192\.168\.[0-9]+\.[0-9]+' src/ tests/ skills/ README.md package.json; then
            echo "ERROR: Potential live API key or private LAN IP detected!"
            exit 1
          fi
          if grep -RInE '^\s*shell\s*:\s*(true|process\.platform)' src/; then
            echo "ERROR: Forbidden shell:true child-process option detected in src/!"
            exit 1
          fi
